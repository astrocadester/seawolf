<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1050" viewBox="0 0 940 1050">
<title>Sea Wolf (1976) Intel 8080 memory map</title><desc>Sea Wolf 1976 memory map with four 1 KB ROM devices, 1 KB working RAM, 7 KB video RAM and unmapped address ranges.</desc>
<rect width="940" height="1050" fill="#0d1724"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#f3f7fa">
<text x="44" y="47" font-size="29" font-weight="700">Sea Wolf</text>
<text x="44" y="74" font-size="12" fill="#a9b9ca">DNA / MIDWAY / 1976 INTEL 8080 ADDRESS SPACE</text>
</g>
<!-- Sea Wolf torpedo mark — unframed vector silhouette. -->
<g transform="translate(816,16)">
  <!-- Torpedo body, rounded nose at right -->
  <path d="M18 28 L32 20 L70 20 Q89 20 101 28 Q89 36 70 36 L32 36 Z"
        fill="#e9dfb9" stroke="#a3bcca" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- Rounded tip and longitudinal casing seam -->
  <path d="M70 21 Q91 23 98 28 Q91 33 70 35" fill="none"
        stroke="#8ba4af" stroke-width="1.1"/>
  <path d="M31 28 H79" fill="none" stroke="#526b7a" stroke-width="1.3"/>
  <!-- Four aft stabilizing fins and propeller -->
  <path d="M32 20 L21 9 L21 19 L13 15 L17 25 L17 31 L13 41 L21 37 L21 47 L32 36 Z"
        fill="#b4c9d3" stroke="#e9dfb9" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M18 28 L7 23 L10 28 L7 33 Z"
        fill="#e9dfb9" stroke="#a3bcca" stroke-width="1.3"/>
  <circle cx="18" cy="28" r="2.3" fill="#0d1724" stroke="#e9dfb9" stroke-width="1.2"/>
  <path d="M11 19 L18 26 L11 35 M13 27 H5" fill="none"
        stroke="#8ba4af" stroke-width="1.2" stroke-linecap="round"/>
</g>
<line x1="22" y1="100" x2="918" y2="100" stroke="#91a8b8" stroke-width="1.5"/>

