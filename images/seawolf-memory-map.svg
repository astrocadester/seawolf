<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1050" viewBox="0 0 940 1050">
<title>Sea Wolf (1976) Intel 8080 memory map</title><desc>Four 1KB original ROM devices, working RAM, 7KB video RAM, and unmapped regions. Styled to match the Checkmate memory map.</desc>
