<g font-family="monospace" font-size="14" fill="#d0dbe7">
<text x="62" y="760">$0000 Reset    $0008/$0010 Interrupt vectors</text>
<text x="62" y="791">$043A Startup    $045E Indexed game interpreter</text>
<text x="62" y="822">$0929 / $0963 / $09A6 Game command streams</text>
<text x="62" y="853">$09E8 Twelve native handler vectors</text>
<text x="62" y="884">$0B8F Digits 0–9    $0C39 Letters A–Z</text>
<text x="62" y="915">$0D3D–$0EB4 Eleven packed graphics records</text>
